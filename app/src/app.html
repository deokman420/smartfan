<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- #141820 is --bar / --bg-card, not --bg: Safari tints the status bar
       from this, and it has to match the sticky header or iOS's scroll-edge
       effect fades the type underneath. appicon.js rewrites it at runtime
       from the token, including the light scheme and the fan-on tint. -->
  <meta name="theme-color" content="#141820" />
  <meta name="description" content="Local-first control and monitoring for the Smartfan humidity-driven extractor." />
  <link rel="icon" href="%sveltekit.assets%/icon.svg" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- black-translucent, not black or default. black would give an opaque
       black bar that does not take theme-color and would drop the fan-on
       tint that [data-fan='on'] paints through this overlay; default can
       paint a light bar on a dark app. The type is kept out of iOS's
       blur band by the header's safe-area padding, not by changing the
       bar style. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Smartfan" />

  <!-- iOS ignores the web manifest's icons for the home screen and will not
       take an SVG. Without this it screenshots the page and uses that, which
       is what it did. Full-bleed square on purpose: iOS applies its own
       rounded mask. Regenerate with tools/make_icons.py. -->
  <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

  <!-- No web fonts from Google. Three requests used to leave the network on
       every load of an app whose whole point is that nothing does; the
       typefaces are served by the fan itself now. See src/app.css. -->
  %sveltekit.head%

  <!-- The scheme, before the first frame.

       This duplicates three lines of src/lib/theme.js on purpose, and it is
       the only duplication in the app that is there by choice. theme.js is
       in the bundle, and the bundle arrives after the browser has already
       painted: every load in light mode began with a dark flash, which on a
       phone in a bright bathroom is the most visible bug in the app.

       Keep the key and the values in step with theme.js. If they ever
       disagree the flash comes back -- theme.js wins a frame later, so it
       fails visibly rather than silently, which is the good way round. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('smartfan.theme');
        // '1' only in the public demo build (scripts/build-demo.mjs),
        // which opens dark by default; theme.js does the same.
        var demo = '%sveltekit.env.PUBLIC_DEMO%' === '1';
        var scheme =
          saved === 'light' || saved === 'dark'
            ? saved
            : demo && saved !== 'system'
              ? 'dark'
              : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = scheme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
